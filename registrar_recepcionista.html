<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AquaAgenda – Registrar Recepcionista</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <div class="logo">
      <a href="home_admin.html"><img src="logo.png" alt="AquaAgenda" /></a>
    </div>
    <nav>
      <ul>
        <li><a href="javascript:history.back()">Regresar</a></li>
        <li><a href="login.html">Cerrar sesión</a></li>
      </ul>
    </nav>
  </header>
  <section class="section">
    <h2 class="section-title">Registrar recepcionista</h2>
    <p style="max-width:700px;margin:0 auto 1.5rem;text-align:center;">
      Completa los datos de la nueva recepcionista. Esta demo no almacena la información, pero muestra cómo se vería el formulario de registro.
    </p>
    <div class="form-container">
      <form onsubmit="registrarRecepcionista(event)">
        <div class="form-group">
          <label for="nombre-recep">Nombre completo</label>
          <input type="text" id="nombre-recep" required />
        </div>
        <div class="form-group">
          <label for="correo-recep">Correo electrónico</label>
          <input type="email" id="correo-recep" required />
        </div>
        <div class="form-group">
          <label for="usuario-recep">Nombre de usuario</label>
          <input type="text" id="usuario-recep" required />
        </div>
        <div class="form-group">
          <label for="contrasena-recep">Contraseña</label>
          <input type="password" id="contrasena-recep" required />
        </div>
        <div class="form-group">
          <label for="confirmar-recep">Confirmar contraseña</label>
          <input type="password" id="confirmar-recep" required />
        </div>
        <div class="form-actions">
          <button type="submit" class="form-submit">Registrar recepcionista</button>
          <a href="home_admin.html" class="form-submit" style="background:var(--accent-color);color:var(--dark-color);text-decoration:none;text-align:center;">Cancelar</a>
        </div>
      </form>
      <div id="mensaje-recepcionista" class="message" style="display:none;"></div>
    </div>
  </section>
  <script>
    function registrarRecepcionista(event) {
      event.preventDefault();
      const nombre = document.getElementById('nombre-recep').value;
      const usuario = document.getElementById('usuario-recep').value;
      const mensaje = document.getElementById('mensaje-recepcionista');
      mensaje.textContent = `Recepcionista ${nombre} (${usuario}) registrada correctamente (demo).`;
      mensaje.style.display = 'block';
      event.target.reset();
    }
  </script>
  <footer>
    <p>&copy; 2025 AquaAgenda – Escuela de Natación</p>
    <p>Los Mochis, Sinaloa, México</p>
  </footer>
</body>
</html>
