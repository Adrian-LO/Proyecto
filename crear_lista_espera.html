<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AquaAgenda – Crear lista de espera</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <div class="logo">
      <a href="javascript:history.back()"><img src="logo.png" alt="AquaAgenda" /></a>
    </div>
    <nav>
      <ul>
        <li><a href="javascript:history.back()">Regresar</a></li>
        <li><a href="login.html">Cerrar sesión</a></li>
      </ul>
    </nav>
  </header>
  <section class="section">
    <h2 class="section-title">Crear lista de espera</h2>
    <p style="max-width:700px;margin:0 auto 1rem;text-align:center;">
      Ingresa la información requerida para agregarte a la lista de espera. Si el sistema no tiene tu sesión, incluye tus datos de contacto.
    </p>
    <div class="form-container" id="form-container">
      <form id="form-lista" onsubmit="return guardarListaEspera(event)">
        <div class="form-group">
          <label for="espera-fecha">Fecha solicitada</label>
          <input type="text" id="espera-fecha" name="espera-fecha" readonly>
        </div>
        <div class="form-group">
          <label for="espera-hora">Hora solicitada</label>
          <input type="text" id="espera-hora" name="espera-hora" readonly>
        </div>
        <div class="form-group">
          <label for="espera-instructor">Instructor preferido</label>
          <select id="espera-instructor" name="espera-instructor">
            <option value="">Cualquiera</option>
            <option value="Juan Pérez">Juan Pérez</option>
            <option value="Ana Sánchez">Ana Sánchez</option>
          </select>
        </div>
        <div class="form-group">
          <label for="espera-nombre">Nombre completo</label>
          <input type="text" id="espera-nombre" name="espera-nombre">
        </div>
        <div class="form-group">
          <label for="espera-telefono">Número de contacto</label>
          <input type="tel" id="espera-telefono" name="espera-telefono">
        </div>
        <div class="form-actions">
          <button class="form-submit" type="submit">Confirmar</button>
          <button class="form-submit" type="button" onclick="cancelar()">Cancelar</button>
        </div>
      </form>
    </div>
  </section>
  <script>
    // Prefill fields from localStorage
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('espera-fecha').value = localStorage.getItem('esperaFecha') || '';
      document.getElementById('espera-hora').value = localStorage.getItem('esperaHora') || '';
      const instPref = localStorage.getItem('esperaInstructor');
      if (instPref) {
        document.getElementById('espera-instructor').value = instPref;
      }
      // Pre-fill name if user is logged in
      const currentUser = localStorage.getItem('currentUser');
      if (currentUser) {
        document.getElementById('espera-nombre').value = currentUser;
      }
    });
    function guardarListaEspera(event) {
      event.preventDefault();
      const fecha = document.getElementById('espera-fecha').value;
      const hora = document.getElementById('espera-hora').value;
      const instructor = document.getElementById('espera-instructor').value || (localStorage.getItem('esperaInstructor') || '');
      const nombre = document.getElementById('espera-nombre').value || (localStorage.getItem('currentUser') || 'Cliente');
      const telefono = document.getElementById('espera-telefono').value || '';
      // Verificar que no exista duplicado exacto para el mismo alumno y clase
      const lista = JSON.parse(localStorage.getItem('listaEspera')) || [];
      const duplicado = lista.some(item => item.fecha === fecha && item.hora === hora && item.instructor === instructor && item.alumno === nombre);
      if (duplicado) {
        alert('Ya estás registrado en la lista de espera para esta clase.');
        return false;
      }
      const entry = { fecha, hora, instructor, alumno: nombre, telefono };
      lista.push(entry);
      localStorage.setItem('listaEspera', JSON.stringify(lista));
      // Limpiar valores temporales
      localStorage.removeItem('esperaFecha');
      localStorage.removeItem('esperaHora');
      localStorage.removeItem('esperaInstructor');
      alert('Agregado a la lista de espera correctamente.');
      window.location.href = 'lista_espera.html';
      return false;
    }
    function cancelar() {
      // Limpiar valores temporales
      localStorage.removeItem('esperaFecha');
      localStorage.removeItem('esperaHora');
      localStorage.removeItem('esperaInstructor');
      window.history.back();
    }
  </script>
  <footer>
    <p>&copy; 2025 AquaAgenda – Escuela de Natación</p>
    <p>Los Mochis, Sinaloa, México</p>
  </footer>
</body>
</html>
